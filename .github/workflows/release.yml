# Pushing a tag v* (v0.1.0-alpha.1) builds the installers on Windows, macOS and Linux, each on its own runner, and
# attaches them to a GitHub release for that tag: a pre-release when the version has a hyphen (alpha, beta, rc). The
# release notes come from .github/release-notes/<tag>.md, else GitHub's generated ones.
#
# - Windows: the NSIS installer (.exe), unsigned.
# - macOS: a .dmg each for Intel (x64) and Apple silicon (arm64), signed ad hoc, not notarized (no Apple certificate).
# - Linux: an AppImage and a .deb, x64.
name: Release

on:
  push:
    tags: ['v*']
  # Run by hand (Actions → Release → Run workflow) to build the installers without a release, e.g. before tagging.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # First, and quick: a tag has to match package.json's version, which names the installers and is the version the app
  # reports. A tag on a commit with another version would publish files named for that one, so it stops here instead.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches package.json's version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "package.json: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version, $version. Either tag v$version, or set the version first (npm version ${GITHUB_REF_NAME#v} --no-git-tag-version), commit it, and tag that commit. Delete this tag: git push --delete origin $GITHUB_REF_NAME"
            exit 1
          fi

  installers:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: npx electron-builder --win nsis --publish never
          - os: macos-latest
            dist: npx electron-builder --mac dmg --x64 --arm64 --publish never
          - os: ubuntu-latest
            dist: npx electron-builder --linux AppImage deb --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Installers
        run: ${{ matrix.dist }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/$tag.md"
          args=(--title "${tag#v}" --verify-tag)
          if [[ "$tag" == *-* ]]; then args+=(--prerelease); fi
          if [[ -f "$notes" ]]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          gh release create "$tag" installers/* "${args[@]}"
